[preset.0]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="CREDITS.md, LICENSE.txt, THIRD-PARTY-NOTICES.txt, SOURCE.txt"
exclude_filter=""
export_path=""

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="CREDITS.md, LICENSE.txt, THIRD-PARTY-NOTICES.txt, SOURCE.txt"
exclude_filter=""
export_path=""

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false

[preset.2]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="CREDITS.md, LICENSE.txt, THIRD-PARTY-NOTICES.txt, SOURCE.txt"
exclude_filter=""
export_path=""

[preset.2.options]

binary_format/architecture="universal"
application/bundle_identifier="io.github.opsroller.montezuma"
codesign/codesign=1
application/min_macos_version_x86_64="10.15"
application/min_macos_version_arm64="27.0"
notarization/notarization=0

[preset.3]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="CREDITS.md, LICENSE.txt, THIRD-PARTY-NOTICES.txt, SOURCE.txt"
exclude_filter="*/hi/*"
export_path=""

[preset.3.options]

variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
