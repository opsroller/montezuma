#
# Generates the board theme texture sets (git ignores them) before anything validates,
# imports or exports the game. The output is cached by a hash of its inputs:
# the generator, every theme's parameters and the pinned numpy and Pillow.
# On a cache hit the generator only confirms its .inputs stamp and exits.
# Reference: docs/reference/ci-pipeline.md
name: Generate textures
description: Restore or generate the board theme textures
runs:
  using: composite
  steps:
    - name: Cache textures
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          game/assets/textures/*/T_*.png
          game/assets/textures/*/hi/T_*.png
          game/assets/textures/*/.inputs
        key: textures-${{ hashFiles('tools/assets/gen_theme_textures.py', 'tools/assets/themes/*.json', '.github/requirements/assets.txt') }}
    - name: Install numpy and Pillow (pinned, hash-checked)
      shell: bash
      run: |
        python3 -m venv .venv
        .venv/bin/pip install --quiet --no-deps --only-binary=:all: --require-hashes -r .github/requirements/assets.txt
    - name: Generate textures
      shell: bash
      run: .venv/bin/python tools/assets/gen_theme_textures.py
