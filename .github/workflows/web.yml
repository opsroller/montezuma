#
# Web demo build: compiles the GDExtension to WebAssembly with the pinned
# Emscripten, exports the single-threaded web build of the intro level with
# the pinned Godot, and runs it in headless Chromium, Firefox and WebKit the
# way the site loads it. The package is the run's artifact; nothing is deployed.
# Reference: docs/reference/build-pipeline.md
name: web

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - .github/workflows/web.yml
      - tools/release/**
      - CMakeLists.txt
      - core/**
      - extension/**
      - game/**
      - thirdparty/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    # A branch of this repository is checked by its push run on the same
    # commit; pull_request runs only for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # tags and commit count for the version
          submodules: recursive
          persist-credentials: false
      # Compiler cache for godot-cpp, as in build.yml. emcc runs clang through
      # it via EM_COMPILER_WRAPPER. See docs/explanation/about-ci-caching.md.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: build-web-extension
          max-size: 500M
      - name: Cache Emscripten
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/emsdk
          key: emsdk-${{ hashFiles('tools/release/godot.env') }}
      - name: Build the extension (WebAssembly)
        env:
          EM_COMPILER_WRAPPER: ccache
        run: |
          source "$(tools/release/web-fetch-emsdk.sh ~/emsdk)"
          emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMONTEZUMA_BUILD_EXTENSION=ON -DMONTEZUMA_BUILD_TESTS=OFF -DMONTEZUMA_WERROR=ON \
            -DGODOTCPP_TARGET=template_release -DGODOTCPP_THREADS=OFF
          cmake --build build -j4
          ccache --show-stats
      - name: Generate textures
        uses: ./.github/actions/textures
      - name: Cache Godot downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/godot-dl
          key: godot-${{ hashFiles('tools/release/godot.env') }}
      - name: Fetch Godot and the web template
        run: tools/release/fetch-godot.sh ~/godot-dl web_dlink_nothreads_release.zip
      - name: Export
        env:
          GODOT: /home/runner/godot-dl/godot
        run: |
          version="$(tools/release/version.sh)"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"
          tools/release/web-export.sh "$version" dist/web | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload export logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-export-logs
          path: dist/web/logs/
          retention-days: 7
      # Playwright's browser builds are fixed by its pinned version, so the
      # downloads are cached on web-requirements.txt; on a hit the install
      # step only adds the system libraries. See docs/explanation/about-ci-caching.md.
      - name: Cache the browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tools/release/web-requirements.txt') }}
      - name: Install the browser test tools
        run: |
          python3 -m venv ~/web-smoke
          ~/web-smoke/bin/pip install --require-hashes -r tools/release/web-requirements.txt
          ~/web-smoke/bin/python -m playwright install --with-deps chromium firefox webkit
      - name: Run the demo in a browser
        run: ~/web-smoke/bin/python tools/release/web-smoke.py dist/web/montezuma-*-web.zip chromium firefox webkit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: montezuma-web
          path: dist/web/montezuma-*
          if-no-files-found: error
