#
# Web demo build: compiles the GDExtension to WebAssembly with the pinned
# Emscripten, exports the single-threaded web build of the intro level with
# the pinned Godot, and runs it in headless Chromium, Firefox and WebKit the
# way the site loads it, inside Playwright's prebuilt image. The package is
# the run's artifact; nothing is deployed.
# Reference: docs/reference/build-pipeline.md
name: web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/web.yml
      - tools/release/**
      - CMakeLists.txt
      - core/**
      - extension/**
      - game/**
      - thirdparty/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # tags and commit count for the version
          submodules: recursive
          persist-credentials: false
      # Compiler cache for godot-cpp, as in build.yml. emcc runs clang through
      # it via EM_COMPILER_WRAPPER. See docs/explanation/about-ci-caching.md.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          key: build-web-extension
          max-size: 500M
      - name: Cache Emscripten
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/emsdk
          key: emsdk-${{ hashFiles('tools/release/godot.env') }}
      - name: Build the extension (WebAssembly)
        env:
          EM_COMPILER_WRAPPER: ccache
        run: |
          source "$(tools/release/web-fetch-emsdk.sh ~/emsdk)"
          emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMONTEZUMA_BUILD_EXTENSION=ON -DMONTEZUMA_BUILD_TESTS=OFF -DMONTEZUMA_WERROR=ON \
            -DGODOTCPP_TARGET=template_release -DGODOTCPP_THREADS=OFF
          cmake --build build -j4
          ccache --show-stats
      - name: Generate textures
        uses: ./.github/actions/textures
      - name: Cache Godot downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/godot-dl
          key: godot-${{ hashFiles('tools/release/godot.env') }}
      - name: Fetch Godot and the web template
        run: tools/release/fetch-godot.sh ~/godot-dl web_dlink_nothreads_release.zip
      - name: Export
        env:
          GODOT: /home/runner/godot-dl/godot
        run: |
          version="$(tools/release/version.sh)"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"
          tools/release/web-export.sh "$version" dist/web | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload export logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-export-logs
          path: dist/web/logs/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: montezuma-web
          path: dist/web/montezuma-*
          if-no-files-found: error

  # The browser check runs in Playwright's own image, which ships the three
  # browsers and their system libraries, so no run downloads them. The tag
  # must match playwright== in tools/release/web-requirements.txt; the digest
  # pins the exact image. See docs/explanation/about-ci-caching.md.
  browser-smoke:
    name: browser smoke
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble@sha256:a7f6cf3ae520c9d670ad956572c13747ed5abdbba5123a01526f873ed1662528
      # The runner's user, as Playwright's CI guide advises: Firefox refuses
      # to start as root with a home directory it does not own.
      options: --user 1001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: tools/release
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: montezuma-web
          path: dist/web
      # The image carries the browsers but not the Python package; install
      # the hash-pinned one into a virtualenv (the image ships virtualenv).
      - name: Install the Playwright package
        run: |
          virtualenv "$RUNNER_TEMP/web-smoke"
          "$RUNNER_TEMP/web-smoke/bin/pip" install --require-hashes -r tools/release/web-requirements.txt
      - name: Run the demo in a browser
        run: |
          if ! "$RUNNER_TEMP/web-smoke/bin/python" tools/release/web-smoke.py dist/web/montezuma-*-web.zip chromium firefox webkit; then
            echo "::error::The web demo did not hand off montezuma:ready then montezuma:level-completed in a browser. Reproduce with docs/how-to/export-a-web-build.md (check it in a browser)."
            exit 1
          fi
