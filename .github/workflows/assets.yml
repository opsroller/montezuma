#
# Generates the theme textures, then checks game/assets against the theme
# manifest and the asset rules: every referenced file exists and parses,
# meshes and textures stay in budget, every theme has a provenance record,
# source files carry the SPDX line, and no export preset strips the hi/
# texture sets the materials name.
# Reference: docs/reference/ci-pipeline.md
name: assets

# No path filter: the check takes seconds (about a minute when the texture
# cache misses), and a filtered check could never be made required (a PR it
# skips would wait on it forever).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    # A branch of this repository is checked by its push run on the same
    # commit; pull_request runs only for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Textures are build outputs: generate (or restore) them, then check them.
      - name: Generate textures
        uses: ./.github/actions/textures
      - name: Validate assets
        run: .venv/bin/python tools/assets/validate_assets.py
      # The readability checks' maths on synthetic captures (tools/bench).
      - name: Readability check tests
        run: .venv/bin/python -m unittest discover -s tools/bench/tests
      # The texture import settings rule on sample .import files (tools/assets).
      - name: Asset tool tests
        run: .venv/bin/python -m unittest discover -s tools/assets/tests
