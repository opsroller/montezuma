#
# Generates the theme textures, then checks game/assets against the theme
# manifest and the asset rules: every referenced file exists and parses,
# meshes and textures stay in budget, every theme has a provenance record,
# source files carry the SPDX line, and export presets strip hi/ variants
# from mobile and web builds.
# Reference: docs/reference/ci-pipeline.md
name: assets

# No path filter: the check takes seconds (about a minute when the texture
# cache misses), and a filtered check could never be made required (a PR it
# skips would wait on it forever).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Textures are build outputs: generate (or restore) them, then check them.
      - name: Generate textures
        uses: ./.github/actions/textures
      - name: Validate assets
        run: .venv/bin/python tools/assets/validate_assets.py
