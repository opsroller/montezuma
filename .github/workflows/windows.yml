#
# Windows build and tests for PRs that change the build system. Windows is
# off the other PR checks for speed, so a CMake, submodule or godot-cpp
# change that breaks MSVC (such as a C runtime mismatch at link) would only
# show up on main. Code-only PRs skip this; main still builds Windows in the
# tests and build workflows. Reference: docs/reference/ci-pipeline.md
name: windows

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - "**/CMakeLists.txt"
      - "**/*.cmake"
      - .gitmodules
      - thirdparty/**
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build and test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      # Same key as the tests workflow's Windows extension job, so a PR
      # starts from the cache main writes.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: sccache
          key: tests-extension-godot-cpp-10-windows-latest
          max-size: 500M
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build core, GDExtension and tests
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMONTEZUMA_WERROR=ON \
            -DMONTEZUMA_BUILD_EXTENSION=ON -DMONTEZUMA_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          if ! cmake --build build; then
            echo "::error::The build fails on Windows (MSVC). Reproduce from a Visual Studio x64 developer prompt with the commands in docs/how-to/build-and-test.md."
            exit 1
          fi
      - name: Test
        shell: bash
        run: |
          if ! ctest --test-dir build --output-on-failure; then
            echo "::error::A CTest test fails on Windows. Reproduce with ctest --test-dir build --output-on-failure (docs/how-to/build-and-test.md)."
            exit 1
          fi
      - name: Compiler cache stats
        if: always()
        run: sccache --show-stats
