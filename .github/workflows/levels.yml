#
# Plays every campaign level with the balance simulator and fails when a
# level file does not parse or misses a balance target or curve rule.
# Reference: docs/reference/ci-pipeline.md
name: levels

# Fork PRs are path-filtered: only level files, the simulator, the core it
# plays, the JSON library the core parses levels with and the build files
# can change the result. Every push runs it.
on:
  # No path filter on push: GitHub would match it against the files of
  # that push alone, so a push that skips the levels would leave its head
  # unchecked.
  push:
    branches: ["**"]
  pull_request:
    paths:
      - "game/data/levels/**"
      - "tools/sim/**"
      - "core/**"
      - "thirdparty/nlohmann/**"
      - "CMakeLists.txt"
      - ".github/workflows/levels.yml"

permissions:
  contents: read

concurrency:
  group: levels-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  balance:
    # A branch of this repository is checked by its push run on the same
    # commit; pull_request runs only for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the simulator
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMONTEZUMA_WERROR=ON \
            -DMONTEZUMA_BUILD_EXTENSION=OFF -DMONTEZUMA_BUILD_TESTS=OFF -DMONTEZUMA_BUILD_SIM=ON
          cmake --build build --target montezuma_sim -j "$(nproc)"
      - name: Check every level against the balance targets
        run: |
          status=0
          build/tools/sim/montezuma_sim game/data/levels --check || status=$?
          if [ "$status" -ne 0 ]; then
            if [ "$status" -eq 2 ]; then
              echo "::error::A level file under game/data/levels does not parse (errors above)."
            else
              echo "::error::A level misses a balance target or curve rule (FAIL rows above)."
            fi
            echo "To fix, correct or tune the level (docs/how-to/run-the-balance-simulator.md), then rerun locally:"
            echo "  cmake -S . -B build-rel -DCMAKE_BUILD_TYPE=Release -DMONTEZUMA_BUILD_EXTENSION=OFF -DMONTEZUMA_BUILD_TESTS=OFF"
            echo "  cmake --build build-rel --target montezuma_sim -j"
            echo "  build-rel/tools/sim/montezuma_sim game/data/levels --check"
            exit "$status"
          fi
