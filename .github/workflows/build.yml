#
# Desktop builds: compiles the GDExtension natively per OS, exports the
# Windows, macOS and Linux games once with the pinned Godot, then runs each
# packaged build on its own OS and screenshots its title screen and board.
# The packages and screenshots are the run's artifacts.
# Reference: docs/reference/build-pipeline.md
name: build

on:
  push:
    branches: ["**"]
  pull_request:
    paths:
      - .github/workflows/build.yml
      - tools/release/**
      - CMakeLists.txt
      - core/**
      - extension/**
      - game/**
      - thirdparty/**
  workflow_dispatch:
  # release.yml runs this workflow for a release tag.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  extension:
    # A branch of this repository is checked by its push run on the same
    # commit; pull_request runs only for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    name: extension (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Windows builds only on main, release tags and manual runs, not on feature
        # branches or PRs, to keep feedback fast. A Windows break shows up
        # on main.
        platform: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '["linux","windows","macos"]' || '["linux","macos"]') }}
    env:
      # Per-platform settings, looked up by matrix.platform. (An include list
      # would re-add Windows on PRs.)
      CACHE: ${{ fromJSON('{"linux":"ccache","windows":"sccache","macos":"ccache"}')[matrix.platform] }}
      GENERATOR: ${{ fromJSON('{"linux":"Ninja","windows":"Ninja","macos":"Unix Makefiles"}')[matrix.platform] }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-22.04","windows":"windows-2022","macos":"macos-14"}')[matrix.platform] }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      # Compiler cache for godot-cpp, the bulk of the build. ccache and
      # sccache are content-addressed (preprocessed source, compiler, flags),
      # and PR branches cannot write the caches main reads, so the released
      # library is the same as a cold build. See docs/explanation/about-ci-caching.md.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: ${{ env.CACHE }}
          key: build-extension-godot-cpp-10-${{ matrix.platform }}
          max-size: 500M
      # Ninja or Makefiles so every compile goes through the launcher; the
      # Visual Studio generator would bypass it.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.platform }}" = macos ]; then
            extra=(-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15)
          fi
          cmake -S . -B build -G "$GENERATOR" -DCMAKE_BUILD_TYPE=Release \
            -DMONTEZUMA_BUILD_EXTENSION=ON -DMONTEZUMA_BUILD_TESTS=OFF -DMONTEZUMA_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER="$CACHE" -DCMAKE_CXX_COMPILER_LAUNCHER="$CACHE" \
            -DGODOTCPP_TARGET=template_release "${extra[@]}"
      - name: Build
        run: cmake --build build -j4
      - name: Compiler cache stats
        shell: bash
        run: $CACHE --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-${{ matrix.platform }}
          path: |
            game/bin/*.so
            game/bin/*.dll
            game/bin/*.dylib
          if-no-files-found: error
          retention-days: 3

  export:
    needs: extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # tags and commit count for the version
          submodules: recursive # godot-cpp's license goes into the notices
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: extension-*
          path: game/bin
          merge-multiple: true
      - name: Generate textures
        uses: ./.github/actions/textures
      - name: Cache Godot downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/godot-dl
          key: godot-${{ hashFiles('tools/release/godot.env') }}
      - name: Fetch Godot and export templates
        run: >
          cmake -DDIR=$HOME/godot-dl
          "-DTEMPLATES=linux_release.x86_64;windows_release_x86_64.exe;windows_release_x86_64_console.exe;macos.zip"
          -P tools/release/fetch-godot.cmake
      - name: Bake lightmaps
        uses: ./.github/actions/lightmaps
        with:
          godot: /home/runner/godot-dl/godot
      - name: Export
        env:
          GODOT: /home/runner/godot-dl/godot
          PLATFORMS: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'linux windows macos' || 'linux macos' }}
        run: |
          version="$(cmake -P tools/release/version.cmake)"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"
          for platform in $PLATFORMS; do
            cmake "-DGODOT=$GODOT" "-DPLATFORM=$platform" "-DVERSION=$version" "-DOUT=dist/$platform" \
              -P tools/release/export-desktop.cmake
          done
          cat dist/*/*.sha256 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload export logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: export-logs
          path: dist/*/logs/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: montezuma-linux
          path: dist/linux/montezuma-*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        with:
          name: montezuma-windows
          path: dist/windows/montezuma-*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: montezuma-macos
          path: dist/macos/montezuma-*
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.platform }})
    needs: export
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && '["linux","windows","macos"]' || '["linux","macos"]') }}
    runs-on: ${{ fromJSON('{"linux":"ubuntu-22.04","windows":"windows-2022","macos":"macos-14"}')[matrix.platform] }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: montezuma-${{ matrix.platform }}
          path: dist
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      # Screenshots need a display: a virtual one on Linux.
      - name: Run the packaged game and capture screenshots (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x720x24" cmake -DARCHIVE=dist -DSCREENS=screenshots -P tools/release/smoke-test.cmake
      - name: Run the packaged game and capture screenshots
        if: runner.os != 'Linux'
        run: cmake -DARCHIVE=dist -DSCREENS=screenshots -P tools/release/smoke-test.cmake
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ matrix.platform }}
          path: screenshots/*.png
          if-no-files-found: error
