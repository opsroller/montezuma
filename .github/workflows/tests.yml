# SPDX-License-Identifier: GPL-2.0-or-later
# Core tests on three OSes, the GDExtension build with every CTest test and
# the headless load, and an ASan/UBSan run. Reference: docs/reference/ci-pipeline.md
name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# A new push to a PR cancels the run it replaces; runs on main always finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        # Windows is off the PR path for speed; pushes to main still run it.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMONTEZUMA_WERROR=ON -DMONTEZUMA_BUILD_EXTENSION=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  extension:
    strategy:
      fail-fast: false
      matrix:
        # Windows only on pushes to main, as for core.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    env:
      CACHE: ${{ fromJSON('{"ubuntu-latest":"ccache","windows-latest":"sccache"}')[matrix.os] }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      # godot-cpp is most of the build time and rarely changes. The compiler
      # cache is content-addressed (it hashes the preprocessed source and the
      # compiler flags), so a stale entry cannot be linked into a new build.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: ${{ env.CACHE }}
          key: tests-extension-godot-cpp-10-${{ matrix.os }}
          max-size: 500M
      # Ninja compiles file by file, which is what the compiler cache needs;
      # the Visual Studio generator would bypass the launcher.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build GDExtension and tests
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMONTEZUMA_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER="$CACHE" -DCMAKE_CXX_COMPILER_LAUNCHER="$CACHE"
          cmake --build build
      # Every CTest test, including the ones that need the extension build
      # (ui_model_tests).
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Compiler cache stats
        shell: bash
        run: |
          "$CACHE" --show-stats
      # Same pinned editor as the build pipeline: one version and checksum,
      # in tools/release/godot.env. Not cached; the download takes seconds.
      - name: Generate textures
        if: runner.os == 'Linux'
        uses: ./.github/actions/textures
      - name: Download Godot
        if: runner.os == 'Linux'
        run: |
          tools/release/fetch-godot.sh ~/godot-dl
          ln -sf ~/godot-dl/godot godot
      - name: Bake lightmaps
        if: runner.os == 'Linux'
        uses: ./.github/actions/lightmaps
        with:
          godot: ./godot
      - name: Load the game headless
        if: runner.os == 'Linux'
        run: |
          ./godot --headless --path game --import
          ./godot --headless --path game --quit-after 120 2>&1 | tee run.log
          if grep -E "ERROR|SCRIPT ERROR|Can't open dynamic library" run.log; then exit 1; fi
      - name: Audio self-test
        if: runner.os == 'Linux'
        run: |
          ./godot --headless --path game --quit-after 120 -- --audio-selftest 2>&1 | tee audio.log
          grep -E "GameAudio self-test: [0-9]+ cues, 0 failures" audio.log
      - name: Game self-test
        if: runner.os == 'Linux'
        run: |
          ./godot --headless --path game --quit-after 120 -- --game-selftest 2>&1 | tee game.log
          grep -E "Match3Game self-test: [0-9]+ moves, outcome 1, [0-9]+ cues, 0 failures" game.log
      # Quits from inside a level, with music and ambience playing, the way
      # a player does: no resources may be left in use at exit.
      - name: In-level quit
        if: runner.os == 'Linux'
        run: |
          ./godot --headless --path game --quit-after 600 -- --start-level=e1-l01 --quit-after-frames=60 2>&1 | tee level.log
          if grep -E "ERROR|SCRIPT ERROR|leaked at exit" level.log; then exit 1; fi
      # Each rendering method offers different quality tiers (desktop pair,
      # mobile, web); switch through them on every method.
      - name: Quality tier self-test
        if: runner.os == 'Linux'
        run: |
          for method in forward_plus mobile gl_compatibility; do
            ./godot --headless --path game --rendering-method "$method" --quit-after 120 -- --quality-selftest 2>&1 | tee "quality-$method.log"
            grep -E "QualityTiers self-test: [0-9]+ checks, 0 failures" "quality-$method.log"
          done
      # The benchmark replay runs headless for a few seconds: it must plan,
      # replay without drifting from the plan and write its report. Frame
      # times are meaningless here (no GPU); docs/how-to/run-the-benchmark.md.
      # --quit-after stops a runner that failed to start instead of hanging.
      - name: Benchmark smoke run
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./godot --headless --path game --quit-after 3600 res://scenes/bench/bench.tscn -- \
            --bench-seconds=3 --bench-warmup=1 --bench-out="$RUNNER_TEMP/bench.json" 2>&1 | tee bench.log
          if grep -E "ERROR|SCRIPT ERROR" bench.log; then exit 1; fi
          python3 -c 'import json, sys; r = json.load(open(sys.argv[1])); assert r["cpu_ms"]["frames"] > 0 and r["replay"]["beats"] > 0 and not r["replay"]["diverged"] and r["features"], r' "$RUNNER_TEMP/bench.json"

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure with ASan and UBSan
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMONTEZUMA_WERROR=ON -DMONTEZUMA_BUILD_EXTENSION=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
