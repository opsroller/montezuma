# SPDX-License-Identifier: GPL-2.0-or-later
# Core tests on three OSes, the GDExtension build and headless load, and an
# ASan/UBSan run. Reference: docs/reference/ci-pipeline.md
name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# A new push to a PR cancels the run it replaces; runs on main always finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        # Windows is off the PR path for speed; pushes to main still run it.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMONTEZUMA_WERROR=ON -DMONTEZUMA_BUILD_EXTENSION=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  extension:
    strategy:
      fail-fast: false
      matrix:
        # Windows only on pushes to main, as for core.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    env:
      CACHE: ${{ fromJSON('{"ubuntu-latest":"ccache","windows-latest":"sccache"}')[matrix.os] }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      # godot-cpp is most of the build time and rarely changes. The compiler
      # cache is content-addressed (it hashes the preprocessed source and the
      # compiler flags), so a stale entry cannot be linked into a new build.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2
        with:
          variant: ${{ env.CACHE }}
          key: tests-extension-${{ matrix.os }}
          max-size: 500M
      # Ninja compiles file by file, which is what the compiler cache needs;
      # the Visual Studio generator would bypass the launcher.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build GDExtension
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMONTEZUMA_BUILD_TESTS=OFF -DMONTEZUMA_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER="$CACHE" -DCMAKE_CXX_COMPILER_LAUNCHER="$CACHE"
          cmake --build build
      - name: Compiler cache stats
        shell: bash
        run: |
          "$CACHE" --show-stats
      - name: Download Godot
        if: runner.os == 'Linux'
        env:
          GODOT_ZIP: Godot_v4.4.1-stable_linux.x86_64.zip
          GODOT_SHA512: ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e
        run: |
          curl -sSfL -o "$GODOT_ZIP" "https://github.com/godotengine/godot/releases/download/4.4.1-stable/$GODOT_ZIP"
          echo "$GODOT_SHA512  $GODOT_ZIP" | sha512sum -c -
          unzip -q "$GODOT_ZIP"
          mv Godot_v4.4.1-stable_linux.x86_64 godot
      - name: Load the game headless
        if: runner.os == 'Linux'
        run: |
          ./godot --headless --path game --import
          ./godot --headless --path game --quit-after 120 2>&1 | tee run.log
          if grep -E "ERROR|SCRIPT ERROR|Can't open dynamic library" run.log; then exit 1; fi
      - name: Audio self-test
        if: runner.os == 'Linux'
        run: |
          ./godot --headless --path game --quit-after 120 -- --audio-selftest 2>&1 | tee audio.log
          grep -E "GameAudio self-test: [0-9]+ cues, 0 failures" audio.log

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure with ASan and UBSan
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMONTEZUMA_WERROR=ON -DMONTEZUMA_BUILD_EXTENSION=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
